<!DOCTYPE html>
<html lang="pt-BR" data-theme="paper">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Estudo Bíblico</title>
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/topbar.css" />
  <link rel="stylesheet" href="./css/reader.css" />
  <link rel="stylesheet" href="./css/interlinear.css" />
  <link rel="stylesheet" href="./css/linguistic.css" />
  <link rel="stylesheet" href="./css/linguistic-totht.css" />
  <link rel="stylesheet" href="./css/linguistic-shebanq.css" />
  <link rel="stylesheet" href="./css/dictionary.css" />
  <link rel="stylesheet" href="./css/bible-search.css" />
  <link rel="stylesheet" href="./css/modals.css" />
  <link rel="stylesheet" href="./css/modals-content.css" />
  <link rel="stylesheet" href="./css/mysword-layout.css" />
</head>
<body>
  <div class="app-shell" id="app-shell">
    <header class="topbar ms-topbar" id="topbar">
      <button type="button" class="ms-menu-trigger" id="btn-main-menu" aria-label="Menu principal" title="Menu de recursos">
        <span class="ms-hamburger-bars" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
        <span class="ms-res-badge ms-res-badge--bible" id="main-mode-badge">&#10013;</span>
      </button>

      <!-- Barra superior no modo Bíblia -->
      <div class="ms-top-strip" id="strip-bible">
        <button type="button" class="ms-green-arrow" id="btn-top-prev-chapter" aria-label="Capítulo anterior" title="Capítulo anterior">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" aria-hidden="true">
            <path d="M5.5 12l6.5-6.5v4.2h6.5v4.6H12v4.2z"></path>
          </svg>
        </button>

        <button type="button" class="ms-ref-btn" id="btn-nav-picker" aria-label="Selecionar livro e capítulo" title="Ir para passagem">
          <span id="label-active-ref">Gn 1</span>
        </button>

        <button type="button" class="ms-green-arrow" id="btn-top-next-chapter" aria-label="Próximo capítulo" title="Próximo capítulo">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" aria-hidden="true">
            <path d="M18.5 12L12 18.5v-4.2H5.5V9.7H12V5.5z"></path>
          </svg>
        </button>

        <button type="button" class="ms-top-spinner" id="btn-bible-picker" aria-label="Selecionar Bíblia" title="Selecionar Bíblia">
          <span id="label-active-bible">Bíblia</span>
        </button>

        <div class="ms-quick-tabs" id="quick-bibles-bar" aria-label="Bíblias rápidas"></div>
      </div>

      <!-- Barra superior no modo Dicionário -->
      <div class="ms-top-strip hidden" id="strip-dict">
        <button type="button" class="ms-top-spinner" id="btn-dict-picker" aria-label="Selecionar Dicionário" title="Selecionar Dicionário">
          <span id="label-active-dict">Dicionário</span>
        </button>

        <button type="button" class="ms-green-arrow" id="btn-top-prev-entry" aria-label="Verbete anterior" title="Verbete anterior">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" aria-hidden="true">
            <path d="M5.5 12l6.5-6.5v4.2h6.5v4.6H12v4.2z"></path>
          </svg>
        </button>

        <button type="button" class="ms-ref-btn" id="btn-dict-terms-top" aria-label="Lista de termos do dicionário" title="Abrir lista de termos">
          <span id="label-active-entry">Termos</span>
        </button>

        <button type="button" class="ms-green-arrow" id="btn-top-next-entry" aria-label="Próximo verbete" title="Próximo verbete">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" aria-hidden="true">
            <path d="M18.5 12L12 18.5v-4.2H5.5V9.7H12V5.5z"></path>
          </svg>
        </button>

        <div class="ms-quick-tabs" id="quick-dicts-bar" aria-label="Dicionários rápidos"></div>
      </div>

      <button type="button" class="ms-overflow-btn" id="btn-overflow-menu" aria-label="Mais opções" title="Opções rápidas">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <circle cx="12" cy="5" r="1.9"></circle>
          <circle cx="12" cy="12" r="1.9"></circle>
          <circle cx="12" cy="19" r="1.9"></circle>
        </svg>
      </button>
    </header>

    <main class="reader-shell" id="reader-shell">
      <div class="reader-scroll" id="reader-scroll">
        <article class="reader-content" id="reader-content">
          <div class="empty-state">
            <p>Carregando leitor...</p>
          </div>
        </article>
      </div>
    </main>

    <footer class="bottom-nav ms-bottom-dock" id="bottom-nav">
      <div class="ms-dock-group">
        <button type="button" class="ms-dock-btn ms-dock-btn--green" id="btn-prev-chapter" aria-label="Anterior" title="Anterior">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" aria-hidden="true">
            <path d="M5.5 12l6.5-6.5v4.2h6.5v4.6H12v4.2z"></path>
          </svg>
        </button>

        <button type="button" class="ms-dock-btn ms-dock-btn--green" id="btn-next-chapter" aria-label="Próximo" title="Próximo">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" aria-hidden="true">
            <path d="M18.5 12L12 18.5v-4.2H5.5V9.7H12V5.5z"></path>
          </svg>
        </button>

        <button type="button" class="ms-dock-btn" id="btn-dock-search" aria-label="Pesquisar" title="Pesquisar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="6.8"></circle>
            <line x1="20" y1="20" x2="16.2" y2="16.2"></line>
          </svg>
        </button>

        <button type="button" class="ms-dock-btn" id="btn-dock-index" aria-label="Índice de livros ou termos" title="Índice">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true">
            <line x1="4" y1="6" x2="20" y2="6"></line>
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <line x1="4" y1="18" x2="15" y2="18"></line>
          </svg>
        </button>

        <button type="button" class="ms-dock-btn" id="btn-settings" aria-label="Configurações e Fontes" title="Configurações">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>

        <button type="button" class="ms-dock-btn ms-dock-btn--blue" id="btn-scroll-up" aria-label="Rolar página acima" title="Rolar acima">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" aria-hidden="true">
            <path d="M12 6.5l6.5 6.5h-4.2v5.5H9.7V13H5.5z"></path>
          </svg>
        </button>

        <button type="button" class="ms-dock-btn ms-dock-btn--blue" id="btn-scroll-down" aria-label="Rolar página abaixo" title="Rolar abaixo">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" aria-hidden="true">
            <path d="M12 17.5l-6.5-6.5h4.2V5.5h4.6V11h4.2z"></path>
          </svg>
        </button>
      </div>

      <span class="ms-dock-meta" id="chapter-meta">—</span>

      <div class="ms-dock-group">
        <button type="button" class="ms-dock-view-btn is-active" id="btn-mode-bible" data-app-mode="bible" aria-label="Modo Bíblia" title="Bíblias">
          <span class="ms-res-badge ms-res-badge--bible">&#10013;</span>
        </button>

        <button type="button" class="ms-dock-view-btn" id="btn-mode-dictionary" data-app-mode="dictionary" aria-label="Modo Dicionário" title="Dicionários">
          <span class="ms-res-badge ms-res-badge--dict">D</span>
        </button>
      </div>
    </footer>
  </div>

  <div class="modal-root" id="modal-root" aria-hidden="true"></div>
  <div class="toast-box" id="toast-box" aria-live="polite"></div>
  <div class="boot-error hidden" id="boot-error" role="alert"></div>

  <script type="module">
    function saveBootLog(title, detail) {
      try {
        const key = 'estudo_biblico_error_logs_v1';
        const prev = JSON.parse(window.localStorage.getItem(key) || '[]');
        const list = Array.isArray(prev) ? prev : [];
        list.push({
          id: Date.now() + '_boot',
          ts: Date.now(),
          level: 'error',
          scope: 'BOOT',
          message: String(title || 'Erro de boot'),
          detail: String(detail || '')
        });
        window.localStorage.setItem(key, JSON.stringify(list.slice(-220)));
      } catch (e) {}
    }

    function showBootError(title, detail) {
      saveBootLog(title, detail);
      const box = document.getElementById('boot-error');
      if (!box) return;
      box.classList.remove('hidden');
      box.innerHTML =
        '<strong>' + title + '</strong>' +
        '<pre>' + String(detail || 'Erro desconhecido') + '</pre>';
    }

    window.addEventListener('error', (ev) => {
      showBootError('Erro de execução', ev.message + ' (' + (ev.filename || '') + ':' + (ev.lineno || 0) + ')');
    });

    window.addEventListener('unhandledrejection', (ev) => {
      const reason = ev.reason && ev.reason.stack ? ev.reason.stack : ev.reason;
      showBootError('Promessa rejeitada', reason);
    });

    import('./js/core/app.js').catch((err) => {
      showBootError('Falha ao inicializar módulo principal', err && err.stack ? err.stack : err);
    });
  </script>
</body>
</html>

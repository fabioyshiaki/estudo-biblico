name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 2.5. Validar sintaxe de todos os arquivos JS
        run: |
          if [ -d "www/js" ]; then
            find www/js -name "*.js" -print0 | xargs -0 -r -n 1 node --check
          else
            echo "Pasta www/js ainda não existe — validação ignorada."
          fi

      - name: 3. Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 4. Instalar dependências do Capacitor
        run: npm install

      - name: 5. Gerar projeto Android (se ainda não existir)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: 6. Aplicar camada nativa customizada (Java + Manifest)
        run: |
          cp -rf native-android/. android/

      - name: 7. Sincronizar pasta www com o Android
        run: npx cap sync android

      - name: 7.5. Restaurar chave fixa de assinatura Debug
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > "$HOME/.android/debug.keystore"
            echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
          else
            echo "::warning::Secret ANDROID_DEBUG_KEYSTORE_B64 não configurado. O APK será assinado com uma chave temporária."
          fi

      - name: 7.6. Atualizar versionCode e versionName automaticamente
        run: |
          node -e '
            const fs = require("fs");
            const file = "android/app/build.gradle";
            let content = fs.readFileSync(file, "utf8");
            const code = Number(process.env.GITHUB_RUN_NUMBER) || 1;
            const name = "1.0." + code;
            if (!/versionCode\s+\d+/.test(content)) {
              throw new Error("versionCode não encontrado em " + file);
            }
            content = content.replace(/versionCode\s+\d+/, "versionCode " + code);
            content = content.replace(/versionName\s+["\x27][^"\x27]+["\x27]/, "versionName \"" + name + "\"");
            fs.writeFileSync(file, content, "utf8");
            console.log("Versão aplicada: versionCode=" + code + " | versionName=" + name);
          '

      - name: 8. Compilar APK Debug instalável
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 9. Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: estudo-biblico-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
